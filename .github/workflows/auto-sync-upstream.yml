name: Auto Sync Upstream (自动同步作者更新)

on:
  schedule:
    # 每天北京时间 02:00、08:00、14:00、20:00
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    # 支持随时在 GitHub 网页上点击按钮立即主动检查同步

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      revision: ${{ steps.merge.outputs.revision }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream repository
        run: |
          git remote add upstream https://github.com/rikkahub/rikkahub.git
          git fetch upstream master

      - name: Compare with upstream
        id: check_diff
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind_count=$BEHIND" >> $GITHUB_OUTPUT
          echo ">>> 相比作者 upstream/master 落后提交数: $BEHIND"

      - name: Merge and Push
        id: merge
        if: steps.check_diff.outputs.behind_count != '0'
        run: |
          echo ">>> 检测到作者有新更新，正在自动合并..."
          if ! git merge-base HEAD upstream/master >/dev/null; then
            echo "::error::Missing shared upstream history. Integrate the verified original baseline before syncing."
            exit 1
          fi
          if ! git merge upstream/master --no-edit -m "chore(auto-sync): 自动同步原作者最新更新 (${{ steps.check_diff.outputs.behind_count }} commits)"; then
            echo "::error::Upstream changes conflict with custom code. Resolve the listed files before publishing."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push origin main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: No updates
        if: steps.check_diff.outputs.behind_count == '0'
        run: |
          echo ">>> 检查完毕：当前已是原作者最新代码，无需同步。"

  build:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-custom-release.yml
    with:
      source_ref: ${{ needs.sync.outputs.revision }}
    secrets: inherit
