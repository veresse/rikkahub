name: Build Custom Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: '发布版本号 (如 3.2.2，留空则使用默认配置)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install web-ui dependencies
        run: |
          cd web-ui
          pnpm install --no-frozen-lockfile

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/custom-release.jks
            echo "Keystore restored successfully."
            ls -lh app/custom-release.jks
          else
            echo "WARNING: KEYSTORE_BASE64 is not set in secrets!"
          fi

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"rikkahub-local","storage_bucket":"rikkahub-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdeg","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Mock google-services.json generated."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/custom-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease --no-daemon --stacktrace

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            echo "tag=v${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          else
            DATE_TAG="v3.2.1-custom-$(date +'%Y%m%d%H%M')"
            echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT
            echo "version=3.2.1" >> $GITHUB_OUTPUT
          fi

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "RikkaHub 专属增强版 ${{ steps.vars.outputs.tag }}"
          body: |
            ### RikkaHub 专属增强版（自动构建）
            - 同步原作者最新功能与漏洞修复
            - 内置夏以昼伴侣全双工打断与实体外设通信
            - 阶梯滞回截断算法，激活 DeepSeek 10 倍 Prompt Cache 降费
            - 支持手机端一键平滑覆盖更新（签名永久一致）
          files: |
            app/build/outputs/apk/github/release/*.apk
          draft: false
          prerelease: false
