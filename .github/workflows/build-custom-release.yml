name: Build Custom Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'APK 与发布版本号（如 3.3.1，留空则自动递增构建版本）'
        required: false
        default: ''
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
    outputs:
      version:
        description: '本次发布的版本号'
        value: ${{ jobs.build.outputs.version }}
      tag:
        description: '本次发布的 Release 标签'
        value: ${{ jobs.build.outputs.tag }}

concurrency:
  group: custom-release-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Determine APK version and release tag
        id: vars
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date +%s) - 1577836800 ))
          BASE_VERSION=$(sed -nE 's/.*versionName = .*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$BASE_VERSION.$VERSION_CODE"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Version must contain three or four numeric components (for example 3.3.1 or 3.3.1.12)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install web-ui dependencies
        run: |
          cd web-ui
          pnpm install --no-frozen-lockfile

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/custom-release.jks
            echo "Keystore restored successfully."
            ls -lh app/custom-release.jks
          else
            echo "WARNING: KEYSTORE_BASE64 is not set in secrets!"
          fi

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"rikkahub-local","storage_bucket":"rikkahub-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdeg","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Mock google-services.json generated."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 先跑单元测试再出包：测试失败时不花时间做 R8 和打包。单元测试包含自定义功能的回归测试，
      # 任何来源（手动推送、定时同步、手动触发）的构建都必须通过后才会发布。
      - name: Test and build with Gradle
        id: gradle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/custom-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_VERSION_NAME: ${{ steps.vars.outputs.version }}
          APK_VERSION_CODE: ${{ steps.vars.outputs.code }}
        run: |
          ./gradlew :app:testGithubDebugUnitTest assembleGithubRelease -PcustomVersionName="$APK_VERSION_NAME" -PcustomVersionCode="$APK_VERSION_CODE" --no-daemon --stacktrace

      - name: Upload unit test report
        if: failure() && steps.gradle.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # 先以草稿上传全部 APK，再公开：应用内更新读取 releases/latest，公开的 Release 必须已经带齐安装包。
      # 发布串行进行（concurrency 组 custom-release-publish），不会与手动推送触发的构建互相覆盖。
      - name: Upload APKs to draft GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ inputs.source_ref || github.sha }}
          name: "RikkaHub 专属增强版 ${{ steps.vars.outputs.tag }}"
          body: |
            ### RikkaHub 专属增强版（自动构建）
            - 同步原作者最新功能与漏洞修复
            - 内置夏以昼伴侣全双工打断与实体外设通信
            - 阶梯滞回截断算法，激活 DeepSeek 10 倍 Prompt Cache 降费
            - 支持手机端一键平滑覆盖更新（签名永久一致）
          files: |
            app/build/outputs/apk/github/release/*.apk
          draft: true
          prerelease: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::草稿 Release $TAG 中没有 APK，拒绝公开。"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true
          echo "已公开 Release $TAG（$COUNT 个 APK）"
